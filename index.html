<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuestas — análisis de jugadores y equipos</title>
<link rel="stylesheet" href="styles.css">
<!-- Scripts clásicos en orden de dependencia: así la página funciona también
     abriéndola con doble clic (los módulos ES los bloquea el navegador en file://) -->
<script src="js/config.js" defer></script>
<script src="js/formato.js" defer></script>
<script src="js/logica.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/datos.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/vistas.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body>
<main>
  <header class="hero" id="hero">
    <p class="lema"><span class="punto-vivo"></span>Datos reales de ESPN</p>
    <h1 class="hero-titulo">Analiza antes de apostar</h1>
    <p class="subtitulo">Tiros, goles y córners de los últimos partidos — de cualquier jugador, club o selección.</p>
  </header>

  <nav class="modos" id="modos" aria-label="Tipo de consulta">
    <button type="button" class="modo" data-modo="tiros">
      <span class="modo-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"></circle>
          <circle cx="12" cy="12" r="4.5"></circle>
          <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"></circle>
        </svg>
      </span>
      <span class="modo-texto">
        <span class="modo-titulo">Tiros por jugador</span>
        <span class="modo-desc">Tiros y tiros a puerta, partido a partido.</span>
      </span>
    </button>

    <button type="button" class="modo" data-modo="partidos">
      <span class="modo-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2.5"></rect>
          <path d="M3 10h18M8 3v4M16 3v4"></path>
          <path d="M8.5 15.5l2.5 2.5 4.5-4.5"></path>
        </svg>
      </span>
      <span class="modo-texto">
        <span class="modo-titulo">Partidos de un equipo</span>
        <span class="modo-desc">Resultados, forma y goles de un club o selección.</span>
      </span>
    </button>

    <button type="button" class="modo" data-modo="corners">
      <span class="modo-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 21V4"></path>
          <path d="M6 4l9 2.6L6 9.8"></path>
          <path d="M13.5 21a7.5 7.5 0 0 0-7.5-7.5"></path>
        </svg>
      </span>
      <span class="modo-texto">
        <span class="modo-titulo">Córners por partido</span>
        <span class="modo-desc">Los que saca y los que concede, con sus líneas.</span>
      </span>
    </button>

    <button type="button" class="modo" data-modo="comparar">
      <span class="modo-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v18"></path>
          <rect x="3" y="8" width="6" height="9" rx="1.5"></rect>
          <rect x="15" y="5" width="6" height="12" rx="1.5"></rect>
        </svg>
      </span>
      <span class="modo-texto">
        <span class="modo-titulo">Comparar dos equipos</span>
        <span class="modo-desc">«América vs Tigres», cara a cara en 8 métricas.</span>
      </span>
    </button>
  </nav>

  <form class="controles" id="formulario" hidden>
    <div class="campo">
      <svg class="campo-lupa" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input type="search" id="entrada-nombre" placeholder="Buscar" autocomplete="off" required>
    </div>
    <select id="selector-partidos" aria-label="Número de partidos">
      <option value="5">Últimos 5</option>
      <option value="10" selected>Últimos 10</option>
      <option value="15">Últimos 15</option>
      <option value="20">Últimos 20</option>
    </select>
    <button type="submit" class="primario" id="boton-buscar">Analizar</button>
  </form>

  <div class="ejemplos" id="ejemplos"></div>
  <div id="estado" class="estado" hidden></div>
  <div id="candidatos" class="candidatos"></div>
  <div id="resultados"></div>
  <div id="tooltip" class="tooltip" role="tooltip"></div>

  <footer class="pie">
    Fuente: API pública de ESPN · los amistosos y rondas menores pueden no incluir córners ·
    ESPN no publica goles esperados (xG).
  </footer>
</main>
</body>
</html>
